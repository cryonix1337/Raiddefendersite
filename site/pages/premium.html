<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium - RaidDefender</title>
  <link rel="icon" href="../assets/raidDefender.png" type="image/png"><link rel="stylesheet" href="../css/premium.css">
</head>
<body>
  <header class="site-header"></header>
  <main class="page">
    <section class="hero"><p class="eyebrow">Premium</p><h1>Choisissez votre abonnement</h1><p>Débloquez toutes les fonctionnalités Premium de RaidDefender.</p></section>
    <section class="pricing">
      <div class="plan"><h2>1 Mois</h2><div class="price">4,99€ <span>/mois</span></div><button class="btn-premium" data-plan="monthly">Payer avec Stripe</button></div>
      <div class="plan best"><span class="badge">POPULAIRE</span><h2>3 Mois</h2><div class="price">11,99€ <span>/3 mois</span></div><button class="btn-premium" data-plan="quarterly">Payer avec Stripe</button></div>
      <div class="plan"><h2>1 An</h2><div class="price">39,99€ <span>/an</span></div><button class="btn-premium" data-plan="yearly">Payer avec Stripe</button></div>
    </section>
  </main>
  <script>
    async function acheter(plan) {
      const discordId = prompt("Entrez votre ID Discord (mode développeur → Copier l’identifiant) :");
      if (!discordId) return;
      if (!/^\d{17,20}$/.test(discordId.trim())) return alert("Cet identifiant Discord n’est pas valide.");
      try {
        const endpoint = location.hostname.endsWith("netlify.app") ? "/.netlify/functions/create-checkout-session" : "/api/create-checkout-session";
        const response = await fetch(endpoint, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({plan, discordId:discordId.trim()}) });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Paiement indisponible");
        window.location.assign(data.url);
      } catch (error) { alert(`Erreur : ${error.message}`); }
    }
    document.querySelectorAll("[data-plan]").forEach((button) => button.addEventListener("click", () => acheter(button.dataset.plan)));
  </script>
</body>
</html>
