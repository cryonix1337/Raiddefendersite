<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium - RaidDefender</title>

  <link rel="icon" href="../assets/raidDefender.png" type="image/png">
  <link rel="stylesheet" href="../css/premium.css">
</head>

<body>

  <header class="site-header"></header>

  <main class="page">

    <section class="hero">
      <p class="eyebrow">Premium</p>
      <h1>Choisissez votre abonnement</h1>
      <p>Débloquez toutes les fonctionnalités Premium de RaidDefender.</p>
    </section>

    <section class="pricing">

      <div class="plan">
        <h2>1 Mois</h2>
        <div class="price">
          4,99€ <span>/mois</span>
        </div>
      </div>

      <div class="plan best">
        <span class="badge">POPULAIRE</span>

        <h2>3 Mois</h2>

        <div class="price">
          11,99€ <span>/3 mois</span>
        </div>
      </div>

      <div class="plan">
        <h2>1 An</h2>

        <div class="price">
          39,99€ <span>/an</span>
        </div>
      </div>

    </section>

  </main>

</body>
</html>
