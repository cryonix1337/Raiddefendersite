<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiement réussi - RaidDefender</title>

    <link rel="icon" href="../assets/raiddefender.png" type="image/png">
    <link rel="apple-touch-icon" href="../assets/raiddefender.png">
    <link rel="stylesheet" href="../css/premium.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #0d1117, #161b22);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 650px;
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            padding: 45px;
            text-align: center;
        }

        .icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        h1 {
            color: #00d26a;
            margin-bottom: 15px;
        }

        p {
            margin: 15px 0;
            line-height: 1.6;
            color: #d6d6d6;
        }

        .session {
            margin-top: 25px;
            padding: 15px;
            background: rgba(255,255,255,.05);
            border-radius: 10px;
            word-break: break-word;
        }

        .btn {
            display: inline-block;
            margin-top: 35px;
            padding: 14px 35px;
            background: #00d26a;
            color: black;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            transition: .25s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .loading {
            color: orange;
        }

        .success {
            color: #00d26a;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="icon">🎉</div>

    <h1>Paiement confirmé !</h1>

    <p>
        Merci pour votre achat Premium.
    </p>

    <p>
        Votre abonnement sera activé automatiquement après confirmation du paiement.
    </p>

    <div class="session">

        <strong>État :</strong>

        <p id="status" class="loading">
            Vérification...
        </p>

        <p id="sessionId"></p>

    </div>

    <a href="../index.html" class="btn">
        Retour à l'accueil
    </a>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const sessionId = params.get("session_id");

const status = document.getElementById("status");

const sessionText = document.getElementById("sessionId");

if(sessionId){

    status.textContent = "Paiement effectué avec succès.";

    status.className = "success";

    sessionText.innerHTML =
        "<strong>ID de session :</strong><br>" +
        sessionId;

}else{

    status.textContent = "Impossible de vérifier le paiement.";

    status.className = "error";

    sessionText.textContent = "";

}

</script>

</body>
</html>
