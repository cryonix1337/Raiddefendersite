<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RaidDefender — Initialisation</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: radial-gradient(circle at center, #0d1220, #05070d);
      overflow: hidden;
      font-family: "Segoe UI", sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Fond animé */
    .grid {
      position: absolute;
      width: 200%;
      height: 200%;
      background-image: 
        linear-gradient(#1a2338 1px, transparent 1px),
        linear-gradient(90deg, #1a2338 1px, transparent 1px);
      background-size: 40px 40px;
      animation: gridMove 12s linear infinite;
      opacity: 0.25;
    }

    @keyframes gridMove {
      from { transform: translate(0, 0); }
      to { transform: translate(-200px, -200px); }
    }

    /* Conteneur principal */
    .container {
      text-align: center;
      z-index: 10;
    }

    /* Logo animé */
    .logo {
      font-size: 3rem;
      font-weight: bold;
      letter-spacing: 4px;
      margin-bottom: 20px;
      animation: glow 2s infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 15px #4f7cff; }
      to   { text-shadow: 0 0 35px #4f7cff; }
    }

    /* Scanner */
    .scanner {
      width: 260px;
      height: 260px;
      border-radius: 50%;
      border: 3px solid rgba(79,124,255,0.4);
      position: relative;
      margin: 0 auto;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(79,124,255,0.3);
    }

    .scanner::before {
      content: "";
      position: absolute;
      top: -100%;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        to bottom,
        transparent,
        rgba(79,124,255,0.5),
        transparent
      );
      animation: scan 2.5s linear infinite;
    }

    @keyframes scan {
      from { top: -100%; }
      to   { top: 100%; }
    }

    /* Texte animé */
    .loading-text {
      margin-top: 25px;
      font-size: 1.2rem;
      letter-spacing: 2px;
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    /* Particules */
    .particles span {
      position: absolute;
      width: 5px;
      height: 5px;
      background: #4f7cff;
      border-radius: 50%;
      opacity: 0.7;
      animation: float 6s linear infinite;
    }

    @keyframes float {
      0% { transform: translateY(0) scale(1); opacity: 0.8; }
      100% { transform: translateY(-100vh) scale(0.2); opacity: 0; }
    }
  </style>

  <!-- Redirection -->
  <meta http-equiv="refresh" content="3.5; url=site/pages/index.html">
</head>

<body>

  <!-- Fond animé -->
  <div class="grid"></div>

  <!-- Particules -->
  <div class="particles"></div>

  <script>
    const particles = document.querySelector(".particles");
    for (let i = 0; i < 50; i++) {
      const p = document.createElement("span");
      p.style.left = Math.random() * 100 + "vw";
      p.style.top = Math.random() * 100 + "vh";
      p.style.animationDelay = Math.random() * 4 + "s";
      p.style.animationDuration = 4 + Math.random() * 4 + "s";
      particles.appendChild(p);
    }
  </script>

  <!-- Contenu -->
  <div class="container">
    <div class="logo">RaidDefender</div>
    <div class="scanner"></div>
    <div class="loading-text">Initialisation du système...</div>
  </div>

</body>
</html>
